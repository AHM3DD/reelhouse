{% extends "base.html" %}
{% load ui static %}

{% block content %}
<div class="relative isolate overflow-hidden">
  <div class="pointer-events-none absolute inset-0 -z-10 opacity-60" aria-hidden="true">
    <div class="absolute -left-40 top-0 h-[28rem] w-[28rem] rounded-full bg-accent/10 blur-3xl"></div>
    <div class="absolute -right-32 bottom-0 h-[24rem] w-[24rem] rounded-full bg-ember/10 blur-3xl"></div>
  </div>
  <div class="container-page flex min-h-[calc(100vh-12rem)] items-center justify-center py-14">
    <div class="w-full max-w-md">
      <div class="text-center">
        <span class="inline-flex text-accent">{% icon "reel" "h-10 w-10" stroke="1.6" %}</span>
        <h1 class="mt-4 font-display text-4xl text-white sm:text-5xl">{% block heading %}{% endblock %}</h1>
        <p class="mt-2 text-sm text-zinc-400">{% block subheading %}{% endblock %}</p>
      </div>
      <div class="card mt-8 p-6 shadow-2xl shadow-black/40 sm:p-8">
        {% block form %}{% endblock %}
      </div>
      <p class="mt-6 text-center text-sm text-zinc-400">{% block footer_link %}{% endblock %}</p>
    </div>
  </div>
</div>
{% endblock %}
