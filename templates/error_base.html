{% extends "base.html" %}
{% load ui %}

{% block content %}
<div class="container-page flex min-h-[60vh] flex-col items-center justify-center py-20 text-center">
  <p class="font-display text-[7rem] leading-none text-accent/90 sm:text-[9rem]">{% block code %}{% endblock %}</p>
  <h1 class="mt-2 font-display text-4xl text-white sm:text-5xl">{% block heading %}{% endblock %}</h1>
  <p class="mt-4 max-w-md text-zinc-400">{% block message %}{% endblock %}</p>
  <div class="mt-8 flex flex-wrap justify-center gap-3">
    <a href="{% url 'movies:home' %}" class="btn-primary">Back to Discover</a>
    <a href="{% url 'movies:search' %}" class="btn-secondary">{% icon "search" "h-4 w-4" %} Search movies</a>
  </div>
</div>
{% endblock %}
