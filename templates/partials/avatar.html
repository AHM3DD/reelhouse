{% if profile.avatar %}<img src="{{ profile.avatar.url }}" alt="" width="80" height="80" loading="lazy" class="{{ size|default:'h-10 w-10' }} shrink-0 rounded-full object-cover ring-1 ring-white/10">{% else %}<span aria-hidden="true" class="{{ size|default:'h-10 w-10' }} inline-flex shrink-0 select-none items-center justify-center rounded-full font-semibold text-white ring-1 ring-white/10" style="background: linear-gradient(135deg, hsl({{ profile.avatar_hue }} 55% 38%), hsl({{ profile.avatar_hue }} 45% 22%));">{{ profile.initial }}</span>{% endif %}
