{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong &middot; Reelhouse</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07070b; color: #e4e4e7;
           font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 1.5rem; }
    .code { font-family: "Instrument Serif", Georgia, serif; font-size: 7rem; line-height: 1; color: #f5b544; margin: 0; }
    h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 2.5rem; color: #fff; margin: .5rem 0 0; }
    p { color: #a1a1aa; max-width: 28rem; margin: 1rem auto 2rem; line-height: 1.6; }
    a { display: inline-block; background: #f5b544; color: #07070b; font-weight: 600; text-decoration: none; padding: .7rem 1.4rem; border-radius: 999px; }
    a:focus-visible { outline: 2px solid #f5b544; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">500</p>
    <h1>The projector jammed</h1>
    <p>Something went wrong on our side. The team has been notified in the logs; please try again in a moment.</p>
    <a href="/">Back to Reelhouse</a>
  </main>
</body>
</html>
