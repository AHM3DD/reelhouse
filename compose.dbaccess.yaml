# Optional: expose PostgreSQL to the HOST's loopback so a DB client can reach it
# through an SSH tunnel. Not used unless you pass it explicitly:
#
#   docker compose -f compose.yaml -f compose.dbaccess.yaml up -d     # open the port
#   docker compose -f compose.yaml up -d                              # close it again
#
# Host port 5434 avoids clashing with other PostgreSQL containers on 5432.
# The right-hand number must match POSTGRES_PORT in .env (default 5433).
services:
  db:
    ports:
      - "127.0.0.1:5434:${POSTGRES_PORT:-5433}"
